<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大世界 · 通用常识面板</title>
<style>
  :root {
    --bg: #0e0a09;
    --panel: #1a1412;
    --panel-2: #241c19;
    --line: rgba(212, 175, 55, 0.18);
    --line-strong: rgba(212, 175, 55, 0.38);
    --text: #efe4d6;
    --text-2: #b7a894;
    --text-3: #8e8072;
    --accent: #d4af37;
    --accent-2: #f3e5ab;
    --ok: #8fd6a8;
    --warn: #e8b465;
    --danger: #c94a53;
    --radius: 12px;
    --radius-sm: 6px;
    --shadow: 0 14px 40px rgba(0, 0, 0, 0.55);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --serif: "Noto Serif SC", SimSun, serif;
    --mono: "SF Mono", Consolas, "Liberation Mono", Menlo, Courier, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { width: 100%; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: var(--sans);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .jz-wrap { padding: 10px 8px; }
  .jz {
    max-width: 760px;
    margin: 0 auto;
    border-radius: var(--radius);
    overflow: hidden;
    background: linear-gradient(176deg, var(--panel) 0%, var(--bg) 92%);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
  }

  /* 顶部导航与自证栏 */
  .jz-hd {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: rgba(212, 175, 55, 0.05);
    flex-wrap: wrap;
  }
  .jz-hd-main {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .jz-hd i.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
    display: inline-block;
  }
  .jz-hd b {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent-2);
  }

  /* 注入自证徽章 */
  .jz-cert-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid rgba(143, 214, 168, 0.35);
    background: rgba(143, 214, 168, 0.10);
    color: var(--ok);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
  }
  .jz-cert-badge:hover {
    background: rgba(143, 214, 168, 0.20);
    border-color: rgba(143, 214, 168, 0.55);
    transform: translateY(-1px);
  }
  .jz-cert-badge:active { transform: translateY(0); }
  .jz-cert-badge:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  .jz-cert-badge.warn {
    border-color: rgba(232, 180, 101, 0.4);
    background: rgba(232, 180, 101, 0.12);
    color: var(--warn);
  }
  .jz-cert-badge i.pulse {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    display: inline-block;
    animation: jzPulse 2s infinite ease-in-out;
  }
  @keyframes jzPulse {
    0%, 100% { opacity: 0.9; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.75); }
  }

  .jz-hd-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .jz-chip {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: var(--text-2);
    white-space: nowrap;
    background: rgba(255, 255, 255, 0.03);
  }

  .jz-bd { padding: 14px 14px 16px; }

  /* 核心充能仪表盘 */
  .jz-dashboard {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px;
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line);
  }
  .jz-metric-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .jz-lbl {
    font-size: 11.5px;
    color: var(--text-2);
    letter-spacing: 0.06em;
    flex: none;
    min-width: 68px;
  }
  .jz-num-box {
    display: flex;
    align-items: baseline;
    gap: 2px;
    min-width: 64px;
  }
  .jz-num {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #fff;
    font-family: var(--mono);
  }
  .jz-num small {
    font-size: 10.5px;
    font-weight: 400;
    color: var(--text-3);
  }
  .jz-bar {
    flex: 1;
    min-width: 120px;
    height: 8px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .jz-bar > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 4px;
    transition: width 0.35s ease;
  }

  /* 充能池槽位（硬上限3） */
  .jz-pool-slots {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .jz-slot-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1.5px solid var(--line-strong);
    background: transparent;
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .jz-slot-dot.active {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  /* 分割与标题行 */
  .jz-sec-hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 16px 0 8px;
    gap: 8px;
  }
  .jz-sec-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent-2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .jz-sec-title::before {
    content: "";
    width: 3px;
    height: 12px;
    background: var(--line-strong);
    border-radius: 2px;
    display: inline-block;
  }
  .jz-sec-sub {
    font-size: 10.5px;
    color: var(--text-3);
  }

  /* 角色状态与抗性格子 */
  .jz-cast-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }
  .jz-char-card {
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-left-width: 3px;
    padding: 9px 10px;
    display: grid;
    gap: 6px;
    transition: background 0.16s ease, border-color 0.16s ease;
  }
  .jz-char-card:hover {
    background: rgba(255, 255, 255, 0.04);
  }
  .jz-char-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .jz-char-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    object-fit: cover;
    object-position: 50% 12%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    flex: none;
    display: block;
    background: rgba(255, 255, 255, 0.08);
  }
  .jz-char-name {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text);
  }
  .jz-char-locked-badge {
    margin-left: auto;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid rgba(201, 74, 83, 0.4);
    background: rgba(201, 74, 83, 0.12);
    color: #ffd9de;
    white-space: nowrap;
  }
  .jz-char-unlocked-badge {
    margin-left: auto;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid rgba(143, 214, 168, 0.3);
    background: rgba(143, 214, 168, 0.08);
    color: var(--ok);
    white-space: nowrap;
  }
  .jz-char-axes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .jz-axis-cell {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--text-2);
  }
  .jz-axis-mini {
    flex: 1;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  .jz-axis-mini > i { display: block; height: 100%; border-radius: 2px; }
  .jz-char-res {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-3);
    background: rgba(0, 0, 0, 0.2);
    padding: 3px 6px;
    border-radius: 4px;
  }
  .jz-char-res b { color: var(--accent-2); font-family: var(--mono); }
  .jz-char-voice {
    font-size: 10.5px;
    font-style: italic;
    color: var(--text-2);
    line-height: 1.4;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 台账筛选 Tab */
  .jz-ledger-filters {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .jz-filter-btn {
    border: 1px solid rgba(212, 175, 55, 0.22);
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-2);
    font-family: inherit;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.16s ease;
  }
  .jz-filter-btn:hover {
    background: rgba(212, 175, 55, 0.12);
    color: var(--accent-2);
    border-color: rgba(212, 175, 55, 0.4);
  }
  .jz-filter-btn:active { transform: scale(0.97); }
  .jz-filter-btn:focus-visible { outline: 2px solid var(--line-strong); outline-offset: 2px; }
  .jz-filter-btn.active {
    background: rgba(212, 175, 55, 0.20);
    border-color: var(--line-strong);
    color: var(--accent-2);
    font-weight: 600;
  }

  /* 常识台账列表条目 */
  .jz-log-list { display: grid; gap: 6px; }
  .jz-item {
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: var(--radius-sm);
    background: rgba(255, 255, 255, 0.02);
    padding: 8px 10px;
    transition: background 0.16s ease, border-color 0.16s ease;
  }
  .jz-item:hover {
    background: rgba(255, 255, 255, 0.035);
  }
  .jz-item.st-active {
    border-left: 3px solid var(--ok);
  }
  .jz-item.st-closed {
    border-left: 3px solid var(--warn);
    opacity: 0.85;
  }
  .jz-item.st-revoked {
    border-left: 3px solid var(--danger);
    opacity: 0.65;
  }
  .jz-item-hd {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .jz-item-who {
    font-weight: 700;
    color: var(--text);
  }
  .jz-item-id {
    color: var(--text-3);
    font-family: var(--mono);
  }
  .jz-tag-state {
    font-size: 9.5px;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 600;
  }
  .jz-tag-state.active {
    background: rgba(143, 214, 168, 0.18);
    color: var(--ok);
    border: 1px solid rgba(143, 214, 168, 0.4);
  }
  .jz-tag-state.closed {
    background: rgba(232, 180, 101, 0.18);
    color: var(--warn);
    border: 1px solid rgba(232, 180, 101, 0.4);
  }
  .jz-tag-state.revoked {
    background: rgba(201, 74, 83, 0.18);
    color: #ffd9de;
    border: 1px solid rgba(201, 74, 83, 0.4);
  }
  .jz-item-acts {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .jz-btn {
    border: 1px solid var(--line);
    background: rgba(212, 175, 55, 0.09);
    color: var(--accent-2);
    border-radius: 5px;
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    min-height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .jz-btn:hover {
    background: rgba(212, 175, 55, 0.18);
    border-color: var(--line-strong);
  }
  .jz-btn:active { transform: scale(0.97); }
  .jz-btn:focus-visible { outline: 2px solid var(--line-strong); outline-offset: 2px; }
  .jz-btn[disabled] { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
  .jz-btn.danger {
    border-color: rgba(201, 74, 83, 0.4);
    background: rgba(201, 74, 83, 0.12);
    color: #ffd9de;
  }
  .jz-btn.danger:hover {
    background: rgba(201, 74, 83, 0.24);
    border-color: rgba(201, 74, 83, 0.6);
  }
  .jz-btn.success {
    border-color: rgba(143, 214, 168, 0.4);
    background: rgba(143, 214, 168, 0.12);
    color: var(--ok);
  }
  .jz-btn.success:hover {
    background: rgba(143, 214, 168, 0.22);
    border-color: rgba(143, 214, 168, 0.6);
  }
  .jz-item-tx {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    word-break: break-word;
  }
  .jz-item.st-revoked .jz-item-tx {
    text-decoration: line-through;
    color: var(--text-3);
  }

  /* 撤回二次确认条 */
  .jz-confirm-row {
    margin-top: 6px;
    padding: 6px 8px;
    border-radius: 5px;
    background: rgba(201, 74, 83, 0.12);
    border: 1px solid rgba(201, 74, 83, 0.35);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .jz-confirm-tx {
    font-size: 11px;
    color: #ffd9de;
    flex: 1;
    min-width: 140px;
  }

  /* 新增注入命令栏 */
  .jz-inject-bar {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .jz-inject-bar select, .jz-inject-bar input {
    font-family: inherit;
    font-size: 12px;
    color: var(--text);
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 6px;
    padding: 6px 9px;
    outline: none;
    min-height: 32px;
  }
  .jz-inject-bar select {
    min-width: 90px;
    background: var(--panel-2);
  }
  .jz-inject-bar select:focus, .jz-inject-bar input:focus {
    border-color: var(--line-strong);
  }
  .jz-inject-bar input {
    flex: 1;
    min-width: 160px;
  }
  .jz-inject-bar input::placeholder { color: var(--text-3); }

  /* 错误诊断与自报行 */
  .jz-msg {
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--text-2);
    min-height: 1.2em;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .jz-msg[data-t="ok"] { color: var(--ok); background: rgba(143, 214, 168, 0.08); }
  .jz-msg[data-t="warn"] { color: var(--warn); background: rgba(232, 180, 101, 0.08); }
  .jz-msg[data-t="err"] { color: var(--danger); background: rgba(201, 74, 83, 0.12); border: 1px solid rgba(201, 74, 83, 0.3); }

  .jz-err-panel {
    display: none;
    margin-top: 10px;
    padding: 10px;
    border-radius: var(--radius-sm);
    background: rgba(201, 74, 83, 0.12);
    border: 1px solid var(--danger);
  }
  .jz-err-panel.show { display: block; }
  .jz-err-title {
    font-size: 12px;
    font-weight: 700;
    color: #ffd9de;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .jz-err-text {
    font-size: 11px;
    font-family: var(--mono);
    color: #ffccd3;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .jz-readout {
    margin-top: 8px;
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.02em;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    padding-top: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px;
  }
  .jz-readout[data-bad="1"] { color: var(--warn); }

  .jz-empty {
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--text-3);
    padding: 12px 6px;
    text-align: center;
    background: rgba(255, 255, 255, 0.015);
    border-radius: var(--radius-sm);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  @media (max-width: 480px) {
    .jz-cast-grid { grid-template-columns: 1fr; }
    .jz-hd { padding: 8px 10px; }
    .jz-bd { padding: 10px 10px 14px; }
    .jz-btn { min-height: 32px; }
  }
</style>
<!-- compact-layout:begin -->
<style>
  /* ── B 版式 · 紧凑双栏（覆盖式，不改 JS） ── */
  .jz-hd { padding: 6px 10px; }
  .jz-bd { padding: 8px 10px 10px; }
  .jz-dashboard .jz-metric-row:nth-child(3) { display: none; }      /* 本日进度：规则细节，收起 */
  .jz-sec-sub { display: none; }                                     /* 系数说明那行小字 */
  .jz-sec-hd { padding: 6px 0 2px; }
  .jz-cast-grid { display: block; }
  .jz-char-card {
    display: grid;
    grid-template-columns: 136px 1fr;
    grid-template-areas: "top axes" "voice voice";
    gap: 1px 10px;
    padding: 3px 8px 4px;
    margin: 0 0 2px;
    background: transparent;
    border: 0;
    border-left: 2px solid currentColor;
    border-radius: 4px;
  }
  .jz-char-top { grid-area: top; }
  .jz-char-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jz-char-locked-badge, .jz-char-unlocked-badge { font-size: 9px; padding: 0 4px; }
  .jz-char-axes { grid-area: axes; display: flex; gap: 12px; align-items: center; }
  .jz-axis-cell { display: flex; align-items: center; gap: 4px; font-size: 10px; }
  .jz-axis-mini { width: 42px; height: 3px; }
  .jz-char-res { display: none; }                                    /* 受辱累计/系数：收起 */
  .jz-char-voice {
    grid-area: voice;
    margin-top: 1px;
    font-size: 11px;
    line-height: 1.4;
    opacity: .72;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .jz-char-avatar { width: 10px; height: 10px; }
  @media (max-width: 560px) {
    .jz-char-card { grid-template-columns: 96px 1fr; }
    .jz-axis-mini { width: 26px; }
  }
</style>
<!-- compact-layout:end -->
</head>
<body>
<div class="jz-wrap">
<div class="jz" id="jz">
  <!-- 顶部状态与自证栏 -->
  <div class="jz-hd">
    <div class="jz-hd-main">
      <i class="dot" aria-hidden="true"></i>
      <b>常识修改系统</b>
      <!-- 注入状态自证（注入：正常 · N 字符） -->
      <button type="button" class="jz-cert-badge" id="jz-cert" title="点击重新校验注入状态">
        <i class="pulse" aria-hidden="true"></i>
        <span id="jz-cert-text">注入：检测中...</span>
      </button>
    </div>
    <div class="jz-hd-right">
      <span class="jz-chip" id="jz-total">常识 0 条</span>
      <span class="jz-chip" id="jz-floor">第 — 楼</span>
      <span class="jz-chip" id="jz-time">时间未就位</span>
    </div>
  </div>

  <div class="jz-bd">
    <!-- 仪表盘：受辱充能、充能池（硬上限3）、本日进度 -->
    <div class="jz-dashboard">
      <!-- 1. 受辱充能进度条 -->
      <div class="jz-metric-row">
        <span class="jz-lbl">受辱充能</span>
        <div class="jz-num-box">
          <span class="jz-num" id="jz-shame">0</span>
          <small>/100</small>
        </div>
        <div class="jz-bar">
          <i id="jz-fill" style="background:linear-gradient(90deg, #7d2f38, #c94a53, var(--accent))"></i>
        </div>
        <span class="jz-chip" id="jz-ready">未充能</span>
      </div>

      <!-- 2. 充能池（硬上限 3） -->
      <div class="jz-metric-row">

          el.ready.style.color = '';
        }
      }

      // 充能池（硬上限3）槽位
      if (el.pool) el.pool.textContent = pool;
      var slotDots = el.slots ? el.slots.querySelectorAll('.jz-slot-dot') : [];
      slotDots.forEach(function (dot, idx) {
        if (idx < pool) dot.classList.add('active');
        else dot.classList.remove('active');
      });

      // 本日进度
      if (el['today-gain']) el['today-gain'].textContent = todayGain;
      if (el['today-max']) el['today-max'].textContent = todayMax;
      if (el['today-fill']) {
        var pct = Math.min(100, Math.floor((todayGain / todayMax) * 100));
        el['today-fill'].style.width = pct + '%';
      }
      if (el['round-limit']) el['round-limit'].textContent = '单轮上限 ' + maxInject;
      if (el.lockchip) {
        el.lockchip.textContent = sys['羞辱值锁定'] === false ? '看守已放开' : '只涨不落';
      }
      if (el.add) el.add.disabled = pool < 1;

      // 时间与楼层
      var curId = jzMsgId();
      if (el.floor) el.floor.textContent = curId >= 0 ? ('第 ' + curId + ' 楼') : '第 — 楼';
      var chatVars = jzGetChat() || {};
      var timeObj = chatVars['时间'] || sys['时间'] || {};
      if (el.time) {
        var _d = timeObj['日期'] || timeObj['星期'] || '';
        var _t = timeObj['时段'] || timeObj['钟点'] || '';
        var _p = timeObj['地点'] || '';
        var _line = _d + ((_d && _t) ? ' · ' : '') + _t + (((_d || _t) && _p) ? ' · ' : '') + _p;
        if (!_line && timeObj['第几天'] != null) _line = '第 ' + timeObj['第几天'] + ' 天';
        if (_line) { el.time.textContent = _line; el.time.style.display = ''; }
        else { el.time.style.display = 'none'; }
      }

      // 2. 目标受辱抗性与状态卡片
      var castHTML = '';
      PERSONS.forEach(function (who) {
        var baseKey = BASE[who];
        var shVal = SHOW_AXES ? Math.min(100, Math.max(0, Math.floor(num(dg(chatVars, baseKey + '.羞耻'), 0)))) : 0;
        var deVal = SHOW_AXES ? Math.min(100, Math.max(0, Math.floor(num(dg(chatVars, baseKey + '.欲望'), 0)))) : 0;
        var hoVal = SHOW_AXES ? Math.min(100, Math.max(0, Math.floor(num(dg(chatVars, baseKey + '.好感度'), 0)))) : 0;
        var voice = SHOW_AXES ? String(dg(chatVars, baseKey + '.心声') || '').trim() : '';
        var res = getResistanceInfo(sys, who);
        var col = COLOR[who] || varWhoCol(who);

        castHTML += '<div class="jz-char-card" style="border-left-color:' + col + '">'
          + '<div class="jz-char-top">'
          + avatarImg(who)
          + '<span class="jz-char-name" style="color:' + col + '">' + esc(who) + '</span>'
          + (res.locked
              ? '<span class="jz-char-locked-badge">锁死 ×0.15</span>'
              : '<span class="jz-char-unlocked-badge">系数 ' + res.coefText.split(' ')[0] + '</span>')
          + '</div>'
          + (SHOW_AXES ? ('<div class="jz-char-axes">'
            + '<div class="jz-axis-cell">'
            + '<span>好</span>'
            + '<span class="jz-axis-mini"><i style="width:' + hoVal + '%;background:var(--ok)"></i></span>'
            + '<span style="font-family:var(--mono)">' + hoVal + '</span>'
            + '</div>'
            + '<div class="jz-axis-cell">'
            + '<span>羞</span>'
            + '<span class="jz-axis-mini"><i style="width:' + shVal + '%;background:' + col + '"></i></span>'
            + '<span style="font-family:var(--mono)">' + shVal + '</span>'
            + '</div>'
            + '<div class="jz-axis-cell">'
            + '<span>欲</span>'
            + '<span class="jz-axis-mini"><i style="width:' + deVal + '%;background:var(--accent-2)"></i></span>'
            + '<span style="font-family:var(--mono)">' + deVal + '</span>'
            + '</div>'
            + '</div>') : '')
          + '<div class="jz-char-res">'
          + '<span>受辱累计: <b>' + res.count + '</b> 次</span>'
          + '<span>当前收益: <b>' + res.coefText + '</b></span>'
          + '</div>'
          + (voice ? ('<div class="jz-char-voice" title="' + esc(voice) + '">「' + esc(voice) + '」</div>') : '')
          + '</div>';
      });
      if (el['cast-grid']) el['cast-grid'].innerHTML = castHTML;

      // 3. 三态常识台账
      var logs = (sys && sys['修改日志']) || {};
      var allItems = [];

      PERSONS.forEach(function (who) {
        var arr = Array.isArray(logs[who]) ? logs[who] : [];
        arr.forEach(function (it) {
          if (!it || !it['内容']) return;
          var text = String(it['内容']).trim();
          var idNum = num(it.id, 0);
          var isRevoked = (it['状态'] === '已撤回' || it['失效原因'] === '已撤回' || it['失效原因'] === '玩家主动撤回' || isBlockedText(sys, who, text));
          var state = 'active';
          if (isRevoked) state = 'revoked';
          else if (it['启用'] === false || it['状态'] === '已关闭') state = 'closed';

          allItems.push({
            who: who,
            id: idNum,
            content: text,
            state: state,
            enabled: it['启用'] !== false && state === 'active',
            reason: it['失效原因'] || ''
          });
        });
      });

      // 兼顾黑名单中由于旧版被 splice 但实际已作废的条目
      var bl = blacklist(sys);
      bl.forEach(function (b, bidx) {
        if (!b || !b.who || !b.text) return;
        var exists = allItems.some(function (item) {
          return item.who === b.who && item.content.replace(/\s+/g, '') === String(b.text).replace(/\s+/g, '');
        });
        if (!exists) {
          allItems.push({
            who: b.who,
            id: 900 + bidx,
            content: String(b.text).trim(),
            state: 'revoked',
            enabled: false,
            reason: '历史撤回'
          });
        }
      });

      // 计数统计
      var cntAct = 0, cntCls = 0, cntRvk = 0;
      allItems.forEach(function (item) {
        if (item.state === 'active') cntAct++;
        else if (item.state === 'closed') cntCls++;
        else if (item.state === 'revoked') cntRvk++;
      });
      if (el['cnt-all']) el['cnt-all'].textContent = allItems.length;
      if (el['cnt-act']) el['cnt-act'].textContent = cntAct;
      if (el['cnt-cls']) el['cnt-cls'].textContent = cntCls;
      if (el['cnt-rvk']) el['cnt-rvk'].textContent = cntRvk;
      if (el.total) el.total.textContent = '生效 ' + cntAct + ' / 共 ' + allItems.length;

      // 筛选展示
      var filtered = allItems.filter(function (item) {
        if (currentFilter === 'active') return item.state === 'active';
        if (currentFilter === 'closed') return item.state === 'closed';
        if (currentFilter === 'revoked') return item.state === 'revoked';
        return true;
      });

      var listHTML = '';
      if (!filtered.length) {
        listHTML = '<div class="jz-empty">暂无该分类的常识条目。充能池满 100 获得可用次数后，可在此注入与管理三态生命期。</div>';
      } else {
        filtered.forEach(function (item) {
          var itemKey = item.who + '#' + item.id;
          var isAsking = askRevokeKey === itemKey;
          var col = COLOR[item.who] || varWhoCol(item.who);

          var tagClass = item.state === 'active' ? 'active' : (item.state === 'closed' ? 'closed' : 'revoked');
          var tagText = item.state === 'active' ? '生效中' : (item.state === 'closed' ? '已关闭' : '已撤回');
          var rowClass = item.state === 'active' ? 'st-active' : (item.state === 'closed' ? 'st-closed' : 'st-revoked');

          listHTML += '<div class="jz-item ' + rowClass + '" data-who="' + esc(item.who) + '" data-id="' + esc(item.id) + '">'
            + '<div class="jz-item-hd">'
            + '<span class="jz-item-who" style="color:' + col + '">' + esc(item.who) + '</span>'
            + '<span class="jz-item-id">#' + item.id + '</span>'
            + '<span class="jz-tag-state ' + tagClass + '">' + tagText + '</span>'
            + '<div class="jz-item-acts">';

          if (item.state === 'active') {
            listHTML += '<button type="button" class="jz-btn mini" data-act="toggle" data-to="false">关闭</button>'
              + '<button type="button" class="jz-btn mini danger" data-act="ask">撤回</button>';
          } else if (item.state === 'closed') {
            listHTML += '<button type="button" class="jz-btn mini success" data-act="toggle" data-to="true">开启</button>'
              + '<button type="button" class="jz-btn mini danger" data-act="ask">撤回</button>';
          } else {
            listHTML += '<span style="font-size:10px;color:var(--text-3)">永久作废</span>';
          }

          listHTML += '</div></div>'
            + '<div class="jz-item-tx">' + esc(item.content) + '</div>';

          if (isAsking) {
            listHTML += '<div class="jz-confirm-row">'
              + '<span class="jz-confirm-tx">确定彻底作废 ' + esc(item.who) + ' #' + item.id + ' 吗？永久撤回不可恢复。</span>'
              + '<button type="button" class="jz-btn mini danger" data-act="do-revoke">确认撤回</button>'
              + '<button type="button" class="jz-btn mini" data-act="cancel-revoke">取消</button>'
              + '</div>';
          }

          listHTML += '</div>';
        });
      }
      if (el['log-list']) el['log-list'].innerHTML = listHTML;

      // 4. 自证与状态更新
      updateSelfCertUI();
      if (el['ro-info']) {
        el['ro-info'].textContent = '数据源: ' + (readBox() ? '聊天变量(常识修改系统)' : '待初始化 → 查角色脚本勾选 / MVU 加载 / 是否旧聊天')
          + ' | ' + (SHAME_ON ? '受辱充能 + 注入锁死机制生效中' : '自由注入模式');
      }
      if (el['ro-sync']) {
        el['ro-sync'].textContent = '台账三态: ' + cntAct + '生效 / ' + cntCls + '关闭 / ' + cntRvk + '撤回'
          + ' · 读到第 ' + (jzMsgId() >= 0 ? jzMsgId() : '—') + ' 楼';
      }
    } catch (e) {
      jzReportError('渲染面板', e);
    }
  }

  /* 注入常识动作 */
  async function doAdd() {
    try {
      var who = el.who ? el.who.value : '';
      var text = el.text ? String(el.text.value || '').trim() : '';
      if (!who) { say('请选择目标人物', 'warn'); return; }
      if (!text) { say('请输入常识内容', 'warn'); return; }

      var r = await writeBox(function (sys) {
        var lg = sys['修改日志'] || (sys['修改日志'] = {});
        var arr = Array.isArray(lg[who]) ? lg[who] : (lg[who] = []);
        if (arr.some(function (it) { return it && String(it['内容']).trim() === text; })) {
          return { ok: false, why: '该条常识已存在于目标台账中' };
        }
        var curPool = Math.floor(num(sys['充能池'] != null ? sys['充能池'] : sys['可用次数'], 0));
        if (NEED_CHARGE && curPool < 1) {
          return { ok: false, why: '充能池次数不足，请先累计羞辱值至 100 转化充能' };
        }

        // 清理历史黑名单意图放行
        if (Array.isArray(sys['撤回黑名单'])) {
          sys['撤回黑名单'] = sys['撤回黑名单'].filter(function (x) {
            return !(x && x.who === who && String(x.text || '').trim() === text);
          });
        }

        var maxId = 0;
        arr.forEach(function (it) {
          var n = num(it && it.id, 0);
          if (n > maxId) maxId = n;
        });

        arr.push({
          id: maxId + 1,
          '内容': text,
          '启用': true,
          '状态': '生效中',
          '失效原因': '',
          '已锁定受辱': true
        });

        // 扣除充能池（自由模式不扣）
        var nextPool = NEED_CHARGE ? Math.max(0, curPool - 1) : curPool;
        sys['充能池'] = nextPool;
        sys['可用次数'] = nextPool;

        return {
          ok: true,
          msg: '已为 ' + who + ' 注入常识 #' + (maxId + 1) + '，剩余可用充能: ' + nextPool,
          check: function (box) {
            var list = dg(box, '修改日志.' + who, []);
            return (Array.isArray(list) && list.some(function (it) { return it && it['内容'] === text; }))
              ? '' : '校验未检测到新条目';
          }
        };
      });

      say(r.msg || r.why, r.ok ? 'ok' : 'warn');
      if (r.ok) {
        if (el.text) el.text.value = '';
        refreshInjection('面板注入');
        paint();
      }
    } catch (e) {
      jzReportError('注入新常识', e);
    }
  }

  /* 切换开关（生效中 <-> 已关闭） */
  async function doToggle(who, id, wantOn) {
    try {
      var r = await writeBox(function (sys) {
        var lg = sys['修改日志'] || {};
        var arr = Array.isArray(lg[who]) ? lg[who] : [];
        var it = arr.find(function (x) { return x && num(x.id, 0) === id; });
        if (!it) return { ok: false, why: '未找到 ' + who + ' #' + id };
        if (it['状态'] === '已撤回') return { ok: false, why: '已撤回的条目不可直接开关' };

        it['启用'] = wantOn;
        it['状态'] = wantOn ? '生效中' : '已关闭';
        it['失效原因'] = wantOn ? '' : '玩家手动关闭';

        // 写入矫正记录
        var old = String(sys['矫正记录'] || '');
        var note = who + ' #' + id + ' 状态切换为: ' + it['状态'];
        sys['矫正记录'] = (old ? (old + '；') : '') + note;
        if (sys['矫正记录'].length > 300) sys['矫正记录'] = sys['矫正记录'].slice(-300);

        return {
          ok: true,
          msg: '已' + (wantOn ? '开启' : '关闭') + ' ' + who + ' #' + id,
          check: function (box) {
            var it2 = (dg(box, '修改日志.' + who, []) || []).find(function (x) { return x && num(x.id, 0) === id; });
            return (it2 && it2['启用'] === wantOn) ? '' : '回读校验未达预期';
          }
        };
      });

      say(r.msg || r.why, r.ok ? 'ok' : 'warn');
      if (r.ok) {
        refreshInjection('面板开关');
        paint();
      }
    } catch (e) {
      jzReportError('切换常识状态', e);
    }
  }

  /* 彻底撤回常识 */
  async function doRevoke(who, id) {
    try {
      var r = await writeBox(function (sys) {
        var lg = sys['修改日志'] || {};
        var arr = Array.isArray(lg[who]) ? lg[who] : [];
        var it = arr.find(function (x) { return x && num(x.id, 0) === id; });
        if (!it) return { ok: false, why: '未找到 ' + who + ' #' + id };

        var text = String(it['内容'] || '').trim();
        it['启用'] = false;
        it['状态'] = '已撤回';
        it['失效原因'] = '玩家主动撤回';

        // 记入撤回黑名单防模型复活
        var bl = Array.isArray(sys['撤回黑名单']) ? sys['撤回黑名单'] : (sys['撤回黑名单'] = []);
        if (!bl.some(function (b) { return b && b.who === who && String(b.text || '').trim() === text; })) {
          bl.push({ who: who, text: text });
        }

        // 写入矫正记录
        var old = String(sys['矫正记录'] || '');
        var note = who + ' #' + id + ' 已被玩家彻底撤回作废，不再生效。';
        sys['矫正记录'] = (old ? (old + '；') : '') + note;
        if (sys['矫正记录'].length > 300) sys['矫正记录'] = sys['矫正记录'].slice(-300);

        return {
          ok: true,
          msg: '已彻底撤回 ' + who + ' #' + id,
          check: function (box) {
            var it2 = (dg(box, '修改日志.' + who, []) || []).find(function (x) { return x && num(x.id, 0) === id; });
            return (it2 && it2['状态'] === '已撤回') ? '' : '回读校验未标记为已撤回';
          }
        };
      });

      askRevokeKey = '';
      say(r.msg || r.why, r.ok ? 'ok' : 'warn');
      if (r.ok) {
        refreshInjection('面板撤回');
        paint();
      }
    } catch (e) {
      jzReportError('撤回常识', e);
    }
  }

  /* 事件绑定 */
  function bindEvents() {
    // 注入按钮与回车
    if (el.add) el.add.addEventListener('click', doAdd);
    if (el.text) {
      el.text.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doAdd();
      });
    }

    // 自证徽章点击重新刷新
    if (el.cert) {
      el.cert.addEventListener('click', function () {
        refreshInjection('手动自证核验');
        setTimeout(function () {
          updateSelfCertUI();
          say('已触发常识注入单通道刷新校验', 'ok');
        }, 200);
      });
    }

    // 复制报错信息
    if (el['copy-err']) {
      el['copy-err'].addEventListener('click', function () {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(lastErrorPayload || '无报错日志');
            say('报错日志已复制到剪贴板', 'ok');
          } else {
            prompt('请复制以下报错日志：', lastErrorPayload);
          }
        } catch (e) {
          say('复制失败，请在控制台查看', 'warn');
        }
      });
    }

    // 筛选 Tab 切换
    if (el.filters) {
      el.filters.addEventListener('click', function (e) {
        var btn = e.target && e.target.closest('button[data-filter]');
        if (!btn) return;
        currentFilter = btn.getAttribute('data-filter') || 'all';
        var btns = el.filters.querySelectorAll('button[data-filter]');
        btns.forEach(function (b) { b.classList.toggle('active', b === btn); });
        paint();
      });
    }

    // 台账操作按钮（开关、撤回、确认撤回）
    if (el['log-list']) {
      el['log-list'].addEventListener('click', function (e) {
        var btn = e.target && e.target.closest('button[data-act]');
        if (!btn) return;
        var itemEl = btn.closest('.jz-item');
        if (!itemEl) return;
        var who = itemEl.getAttribute('data-who');
        var id = num(itemEl.getAttribute('data-id'), 0);
        var act = btn.getAttribute('data-act');
        var key = who + '#' + id;

        if (act === 'toggle') {
          var to = btn.getAttribute('data-to') === 'true';
          doToggle(who, id, to);
        } else if (act === 'ask') {
          askRevokeKey = (askRevokeKey === key) ? '' : key;
          paint();
        } else if (act === 'cancel-revoke') {
          askRevokeKey = '';
          paint();
        } else if (act === 'do-revoke') {
          doRevoke(who, id);
        }
      });
    }
  }

  /* iframe 自适应与初始化 */
  function jzFit() {
    try {
      if (document.documentElement.style.getPropertyValue('--TH-viewport-height')) return;
      var fe = window.frameElement;
      if (!fe) return;
      var h = Math.max(
        document.body ? document.body.scrollHeight : 0,
        document.documentElement ? document.documentElement.scrollHeight : 0
      );
      if (h > 0) fe.style.height = (h + 10) + 'px';
    } catch (e) {}
  }

  function fillWhoOptions() {
    if (!el.who) return;
    el.who.innerHTML = PERSONS.map(function (w) {
      return '<option value="' + esc(w) + '">' + esc(w) + '</option>';
    }).join('');
  }

  function applyModeChrome() {
    // 自由模式：隐藏受辱充能与本日进度两行，并把池子标签改成中性文案
    if (SHAME_ON) return;
    try {
      var rows = document.querySelectorAll('.jz-metric-row');
      if (rows[0]) rows[0].style.display = 'none';
      if (rows[2]) rows[2].style.display = 'none';
      var lbl = document.querySelectorAll('.jz-metric-row .jz-lbl');
      if (lbl[1]) lbl[1].textContent = '注入次数';
    } catch (e) {}
    try {
      var sub = document.querySelector('.jz-sec-sub');
      if (sub) sub.textContent = '自由模式：不统计受辱抗性，注入只看单轮上限';
    } catch (e) {}
  }

  function init() {
    try {
      fillWhoOptions();
      applyModeChrome();
      bindEvents();
      paint();
      jzFit();
      setTimeout(jzFit, 500);
      setTimeout(jzFit, 1500);

      // 1. 全局与酒馆事件联动监听
      var evOn = __thEv();   // 修复 E-08：全局拿不到时退到 TavernHelper.eventOn

      var tev = __thTe();   // 修复 E-08b：全局拿不到时退到 TavernHelper.tavern_events
      if (!tev) { try { if (typeof tavern_events !== 'undefined') tev = tavern_events; } catch(e){} }
      if (!tev) { try { if (window.parent && window.parent.tavern_events) tev = window.parent.tavern_events; } catch(e){} }
      if (!tev) { try { if (window.top && window.top.tavern_events) tev = window.top.tavern_events; } catch(e){} }

      if (evOn && tev) {
        try { if (tev.MESSAGE_RECEIVED) evOn(tev.MESSAGE_RECEIVED, function () { setTimeout(function(){ paint(); jzFit(); }, 60); }); } catch(e){}
        try { if (tev.MESSAGE_SENT) evOn(tev.MESSAGE_SENT, function () { setTimeout(function(){ paint(); jzFit(); }, 60); }); } catch(e){}
        try { if (tev.CHAT_COMPLETED) evOn(tev.CHAT_COMPLETED, function () { setTimeout(function(){ paint(); jzFit(); }, 60); }); } catch(e){}
        try { if (tev.VARIABLE_UPDATE_ENDED) evOn(tev.VARIABLE_UPDATE_ENDED, function () { paint(); jzFit(); }); } catch(e){}
      }

      // 2. MVU 初始化与事件监听联动
      var waitInit = __thR('waitGlobalInitialized');   // 修复 E-08c：同样走垫片
      if (!waitInit) { try { if (typeof waitGlobalInitialized === 'function') waitInit = waitGlobalInitialized; } catch(e){} }
      if (!waitInit) { try { if (window.parent && typeof window.parent.waitGlobalInitialized === 'function') waitInit = window.parent.waitGlobalInitialized; } catch(e){} }
      if (!waitInit) { try { if (window.top && typeof window.top.waitGlobalInitialized === 'function') waitInit = window.top.waitGlobalInitialized; } catch(e){} }

      if (waitInit) {
        Promise.resolve().then(function () {
          return waitInit('Mvu');
        }).then(function (M) {
          if (M && M.events && evOn) {
            try {
              evOn(M.events.VARIABLE_INITIALIZED, function () { paint(); jzFit(); });
              evOn(M.events.VARIABLE_UPDATE_ENDED, function () { paint(); jzFit(); });
            } catch (e) {}
          }
        }).catch(function () {});
      }

      // 3. 稳妥的高频与低频检测（每 1.2 秒比对一次数据指纹，保证回合推进后 100% 刷新）
      var lastHash = '';
      setInterval(function () {
        try {
          var b = readBox();
          var t = jzGetChat();
          var hash = JSON.stringify(b) + '|' + (t ? JSON.stringify(t['时间']) : '') + '|' + jzMsgId();
          if (hash !== lastHash) {
            lastHash = hash;
            paint();
            jzFit();
          }
        } catch(e){}
      }, 1200);

      // 4. 窗口聚焦与消息通信联动
      window.addEventListener('focus', function () { paint(); jzFit(); });
      window.addEventListener('message', function (ev) {
        if (ev && ev.data && (ev.data.type === 'variable-update' || ev.data.action === 'repaint' || ev.data.type === 'set-iframe-height')) {
          paint(); jzFit();
        }
      });

      window.__jzRepaint = function () {
        try { paint(); jzFit(); } catch (e) { jzReportError('外部重画触发', e); }
      };
    } catch (e) {
      jzReportError('初始化', e);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
